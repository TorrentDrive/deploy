name: Build Combined TorrentDrive Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [build-combined]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch/tag/SHA to build (defaults to components.lock.json)"
        required: false
        default: ""
      frontend_ref:
        description: "Frontend branch/tag/SHA to build (defaults to components.lock.json)"
        required: false
        default: ""

concurrency:
  # Scoped by ref so a pull request build cannot cancel the main build.
  group: build-combined-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Boots the image with no configuration at all and asserts it comes up.
  # amd64 only: this proves the product's central claim, and proving it twice
  # would not prove it harder.
  smoke:
    name: Smoke test
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.refs.outputs.backend_sha }}
      backend_ref: ${{ steps.refs.outputs.backend_ref }}
      frontend_sha: ${{ steps.refs.outputs.frontend_sha }}
      frontend_ref: ${{ steps.refs.outputs.frontend_ref }}
      version: ${{ steps.refs.outputs.version }}
      major_minor: ${{ steps.refs.outputs.major_minor }}
      should_release: ${{ steps.refs.outputs.should_release }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine refs and next version
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          backend_sha=$(jq -r '.backend.sha' components.lock.json)
          backend_ref=$(jq -r '.backend.ref' components.lock.json)
          frontend_sha=$(jq -r '.frontend.sha' components.lock.json)
          frontend_ref=$(jq -r '.frontend.ref' components.lock.json)

          resolve_latest() {
            local repo="$1"
            local sha ref
            sha=$(gh api "repos/${repo}/commits/main" --jq .sha 2>/dev/null || true)
            ref=$(gh api "repos/${repo}/tags" --jq "[.[] | select(.commit.sha == \"${sha}\")] | .[0].name // empty" 2>/dev/null || true)
            [ -z "$ref" ] && ref="main"
            echo "${sha}:${ref}"
          }

          should_release="true"
          if [ "${{ github.event_name }}" = "push" ]; then
            head_subj=$(git log -1 --format="%s")
            changed_non_docs=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -vE '(\.md$|^docs/)' || true)
            if echo "$head_subj" | grep -qE '^docs(\([^)]+\))?:' || [ -z "$changed_non_docs" ]; then
              should_release="false"
            fi
          fi

          dispatch_bump=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Always sync both components to their latest main/release commits so
            # concurrent dispatches from backend and frontend never drop an update.
            b_info=$(resolve_latest "TorrentDrive/backend")
            f_info=$(resolve_latest "TorrentDrive/frontend")
            [ -n "${b_info%%:*}" ] && backend_sha="${b_info%%:*}" && backend_ref="${b_info#*:}"
            [ -n "${f_info%%:*}" ] && frontend_sha="${f_info%%:*}" && frontend_ref="${f_info#*:}"
            dispatch_bump="${{ github.event.client_payload.bump }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input_backend="${{ github.event.inputs.backend_ref }}"
            input_frontend="${{ github.event.inputs.frontend_ref }}"
            if [ -n "$input_backend" ]; then
              backend_ref="$input_backend"
              backend_sha=$(gh api "repos/TorrentDrive/backend/commits/${input_backend}" --jq .sha)
            fi
            if [ -n "$input_frontend" ]; then
              frontend_ref="$input_frontend"
              frontend_sha=$(gh api "repos/TorrentDrive/frontend/commits/${input_frontend}" --jq .sha)
            fi
          fi

          # Compute next SemVer version
          base_ver=$(tr -d '[:space:]' < VERSION)
          latest_tag=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")

          if [ -z "$latest_tag" ] || ! git rev-parse -q --verify "refs/tags/v${base_ver}" >/dev/null 2>&1; then
            next_ver="$base_ver"
          else
            tag_ver="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$tag_ver"
            if [ -n "$dispatch_bump" ]; then
              case "$dispatch_bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *)     patch=$((patch + 1)) ;;
              esac
            else
              commits=$(git log "${latest_tag}..HEAD" --pretty=format:"%s" 2>/dev/null || echo "")
              if echo "$commits" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
                major=$((major + 1)); minor=0; patch=0
              elif echo "$commits" | grep -qE '^feat(\([^)]+\))?:'; then
                minor=$((minor + 1)); patch=0
              else
                patch=$((patch + 1))
              fi
            fi
            next_ver="${major}.${minor}.${patch}"
          fi
          major_minor="${next_ver%.*}"

          echo "backend        -> ${backend_ref} (${backend_sha})"
          echo "frontend       -> ${frontend_ref} (${frontend_sha})"
          echo "version        -> ${next_ver} (${major_minor})"
          echo "should_release -> ${should_release}"

          {
            echo "backend_sha=${backend_sha}"
            echo "backend_ref=${backend_ref}"
            echo "frontend_sha=${frontend_sha}"
            echo "frontend_ref=${frontend_ref}"
            echo "version=${next_ver}"
            echo "major_minor=${major_minor}"
            echo "should_release=${should_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout backend
        if: github.event_name == 'pull_request' || steps.refs.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/backend
          ref: ${{ steps.refs.outputs.backend_sha }}
          path: backend

      - name: Checkout frontend
        if: github.event_name == 'pull_request' || steps.refs.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/frontend
          ref: ${{ steps.refs.outputs.frontend_sha }}
          path: frontend

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request' || steps.refs.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for testing
        if: github.event_name == 'pull_request' || steps.refs.outputs.should_release == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: torrentdrive-smoke:test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          platforms: linux/amd64

      - name: Smoke test - boot with no configuration at all
        if: github.event_name == 'pull_request' || steps.refs.outputs.should_release == 'true'
        run: bash .github/scripts/smoke-test.sh

  # Each architecture builds on a runner of that architecture.
  # ubuntu-24.04-arm is free for public repositories, so arm64 builds natively
  # and the two architectures run in parallel.
  build:
    name: Build ${{ matrix.arch }}
    needs: smoke
    if: github.event_name == 'pull_request' || needs.smoke.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/torrentdrive" >> "$GITHUB_OUTPUT"

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/backend
          ref: ${{ needs.smoke.outputs.backend_sha }}
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: TorrentDrive/frontend
          ref: ${{ needs.smoke.outputs.frontend_sha }}
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest with no tag. The release job assembles both digests
      # into one manifest list and puts the tags on that, so a tag never points
      # at a single architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish manifest and release
    needs: [smoke, build]
    if: github.event_name != 'pull_request' && needs.smoke.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/torrentdrive" >> "$GITHUB_OUTPUT"

      - name: Generate CalVer tag
        id: calver
        run: |
          set -euo pipefail
          DATE_TAG=$(date +'%Y.%m.%d')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "full_tag=${DATE_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          version="${{ needs.smoke.outputs.version }}"
          major_minor="${{ needs.smoke.outputs.major_minor }}"
          calver_tag="${{ steps.calver.outputs.full_tag }}"

          refs=""
          for digest in *; do
            refs="${refs} ${image}@sha256:${digest}"
          done
          echo "Merging:${refs}"

          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${version}" \
            --tag "${image}:${major_minor}" \
            --tag "${image}:${calver_tag}" \
            ${refs}

          docker buildx imagetools inspect "${image}:latest"

      - name: Checkout deploy repo for release
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit lockfile, tag, and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.smoke.outputs.version }}"
          backend_sha="${{ needs.smoke.outputs.backend_sha }}"
          backend_ref="${{ needs.smoke.outputs.backend_ref }}"
          frontend_sha="${{ needs.smoke.outputs.frontend_sha }}"
          frontend_ref="${{ needs.smoke.outputs.frontend_ref }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          jq --arg bs "$backend_sha" --arg br "$backend_ref" \
             --arg fs "$frontend_sha" --arg fr "$frontend_ref" \
             '.backend.sha = $bs | .backend.ref = $br | .frontend.sha = $fs | .frontend.ref = $fr' \
             components.lock.json > components.lock.json.tmp
          mv components.lock.json.tmp components.lock.json

          echo "${version}" > VERSION

          git add components.lock.json VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${version} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null 2>&1; then
            git tag -a "v${version}" -m "Release v${version}"
            git push origin "v${version}"
          fi

          notes=$(cat <<EOF
          ## Combined Image Release v${version}

          ### Images
          - \`ghcr.io/torrentdrive/torrentdrive:${version}\`
          - \`ghcr.io/torrentdrive/torrentdrive:${{ needs.smoke.outputs.major_minor }}\`
          - \`ghcr.io/torrentdrive/torrentdrive:latest\`

          ### Pinned Components
          - **backend**: \`${backend_ref}\` ([\`${backend_sha:0:8}\`](https://github.com/TorrentDrive/backend/commit/${backend_sha}))
          - **frontend**: \`${frontend_ref}\` ([\`${frontend_sha:0:8}\`](https://github.com/TorrentDrive/frontend/commit/${frontend_sha}))
          EOF
          )

          if ! gh release view "v${version}" >/dev/null 2>&1; then
            gh release create "v${version}" \
              --title "v${version}" \
              --notes "$notes"
          fi
